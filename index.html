<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="便读">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png">
<title>便读 BianDu — 平板深度阅读与本地私人知识库</title>
<style>
  :root {
    /* 1. 颜色规范 (Color Tokens) - 温暖纸张质感，无大面积纯白 */
    --bg-paper: #F4F1EA;
    --bg-paper-elevated: #FAF8F3;
    --bg-paper-warm: #EFECE3;
    --bg-paper-subtle: #E8E4D9;
    --bg-sidebar: #EDE9DF;
    --bg-overlay: rgba(26, 33, 29, 0.28);

    /* 主色：深墨绿色 (Deep Ink Green) */
    --primary: #1F4037;
    --primary-hover: #17312A;
    --primary-soft: #E3ECE8;
    --primary-border: #B8CEC5;

    /* 辅助色：陶土橙 (Terracotta Orange)、柔和金色 (Soft Gold)、淡蓝色 (Pale Blue) */
    --terracotta: #C2654A;
    --terracotta-soft: #F6E6E1;
    --terracotta-border: #E2B8AB;

    --gold: #B68B3A;
    --gold-soft: #F5ECD7;
    --gold-highlight: rgba(226, 189, 107, 0.38);
    --gold-word: #F2DF96;

    --pale-blue: #4E768B;
    --pale-blue-soft: #E5EFF4;
    --pale-blue-border: #BDD2DE;

    /* 文字与边框颜色 */
    --text-main: #1F2522;
    --text-secondary: #525B56;
    --text-muted: #7C857F;
    --border-hairline: #DCD7CA;
    --border-strong: #C5BFB0;

    /* 2. 字体规范 (Typography Tokens) */
    --font-serif: "Songti SC", "Noto Serif SC", "STSong", "Source Han Serif SC", "SimSun", Georgia, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "Inter", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;

    /* 3. 间距、圆角与阴影规范 (Spacing, Radius & Shadows) */
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 10px;
    --shadow-subtle: 0 2px 8px rgba(31, 37, 34, 0.04);
    --shadow-float: 0 8px 24px rgba(31, 37, 34, 0.09);
    --shadow-drawer: -6px 0 24px rgba(31, 37, 34, 0.08);
    --touch-min: 44px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-paper);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.6;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 微妙纸张纹理背景 */
  .paper-texture {
    background-color: var(--bg-paper);
    background-image: radial-gradient(rgba(31, 64, 55, 0.03) 1px, transparent 0);
    background-size: 20px 20px;
  }

  .hero-paper-card {
    background-color: #EFEAE0;
    background-image:
      linear-gradient(90deg, rgba(255,255,255,0.22) 0%, rgba(239,234,224,0.4) 100%),
      radial-gradient(rgba(194, 101, 74, 0.045) 1px, transparent 0);
    background-size: 100% 100%, 16px 16px;
    border: 1px solid #D5CFC0;
  }

  /* 优雅宋体标题 */
  .serif-title {
    font-family: var(--font-serif);
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--text-main);
  }

  /* 统一按钮规范 (点击区域 >= 44px) */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: var(--touch-min);
    padding: 0 16px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-hairline);
    background-color: var(--bg-paper-elevated);
    color: var(--text-main);
    cursor: pointer;
    transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.1s ease;
    user-select: none;
    white-space: nowrap;
  }
  .btn:hover {
    background-color: var(--bg-paper-warm);
    border-color: var(--border-strong);
  }
  .btn:active {
    transform: translateY(1px);
  }
  .btn-primary {
    background-color: var(--primary);
    color: #F7F5F0;
    border-color: var(--primary);
  }
  .btn-primary:hover {
    background-color: var(--primary-hover);
    border-color: var(--primary-hover);
  }
  .btn-terracotta {
    background-color: var(--terracotta-soft);
    color: #96432C;
    border-color: var(--terracotta-border);
  }
  .btn-terracotta:hover {
    background-color: #EED8D0;
  }
  .btn-tonal {
    background-color: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary-border);
  }
  .btn-tonal:hover {
    background-color: #D5E4DD;
  }
  .btn-blue {
    background-color: var(--pale-blue-soft);
    color: var(--pale-blue);
    border-color: var(--pale-blue-border);
  }
  .btn-icon {
    min-width: var(--touch-min);
    min-height: var(--touch-min);
    padding: 0 10px;
  }
  .btn-sm {
    min-height: 38px;
    padding: 0 12px;
    font-size: 13px;
  }

  /* 统一卡片规范 */
  .card {
    background-color: var(--bg-paper-elevated);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-subtle);
  }
  .card-interactive {
    cursor: pointer;
    transition: border-color 0.16s ease, background-color 0.16s ease, transform 0.15s ease;
  }
  .card-interactive:hover {
    border-color: var(--primary-border);
    background-color: #FCFBF8;
  }

  /* 统一输入框规范 */
  .input-box {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--touch-min);
    padding: 0 14px;
    background-color: var(--bg-paper-elevated);
    border: 1px solid var(--border-hairline);
    border-radius: var(--radius-md);
    transition: border-color 0.16s ease;
  }
  .input-box:focus-within {
    border-color: var(--primary);
    background-color: #FDFCF9;
  }
  .input-box input, .input-box select {
    border: none;
    background: transparent;
    outline: none;
    width: 100%;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text-main);
  }
  .input-box input::placeholder {
    color: var(--text-muted);
  }

  /* 标签与徽章 */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    font-size: 12px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
  }
  .badge-green {
    background-color: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary-border);
  }
  .badge-terracotta {
    background-color: var(--terracotta-soft);
    color: #9B462E;
    border-color: var(--terracotta-border);
  }
  .badge-gold {
    background-color: var(--gold-soft);
    color: #84601E;
    border-color: #DEC89A;
  }
  .badge-blue {
    background-color: var(--pale-blue-soft);
    color: var(--pale-blue);
    border-color: var(--pale-blue-border);
  }
  .badge-neutral {
    background-color: var(--bg-paper-warm);
    color: var(--text-secondary);
    border-color: var(--border-hairline);
  }

  /* 整体平板外壳与横竖屏自适应布局 */
  .app-shell {
    display: flex;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* 横屏左侧导航栏 */
  .side-nav {
    width: 208px;
    flex-shrink: 0;
    background-color: var(--bg-sidebar);
    border-right: 1px solid var(--border-hairline);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16px 12px;
    z-index: 20;
  }

  .brand-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px 16px 10px;
    border-bottom: 1px solid var(--border-hairline);
    margin-bottom: 12px;
  }
  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand-mark {
    width: 32px;
    height: 32px;
    border-radius: 7px;
    background-color: var(--primary);
    color: #F6F4EE;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-serif);
    font-size: 17px;
    font-weight: 600;
  }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: var(--touch-min);
    padding: 0 12px;
    border-radius: var(--radius-md);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    background: transparent;
    width: 100%;
    text-align: left;
    transition: all 0.15s ease;
  }
  .nav-item-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-item:hover {
    background-color: rgba(31, 64, 55, 0.05);
    color: var(--text-main);
  }
  .nav-item.active {
    background-color: var(--primary);
    color: #F6F4EE;
    font-weight: 600;
  }
  .nav-item.active .nav-badge {
    background-color: rgba(255,255,255,0.18);
    color: #F6F4EE;
  }
  .nav-badge {
    font-size: 11px;
    padding: 1px 7px;
    border-radius: 4px;
    background-color: var(--bg-paper-subtle);
    color: var(--text-secondary);
  }

  /* 竖屏底部导航栏 */
  .bottom-nav {
    display: none;
    height: 64px;
    background-color: var(--bg-sidebar);
    border-top: 1px solid var(--border-hairline);
    padding: 0 6px;
    align-items: center;
    justify-content: space-around;
    flex-shrink: 0;
    z-index: 30;
  }
  .bottom-nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-width: 48px;
    min-height: 48px;
    padding: 4px 8px;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }
  .bottom-nav-item.active {
    color: var(--primary);
    background-color: var(--primary-soft);
    font-weight: 600;
  }

  /* 主内容区域 */
  .main-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    position: relative;
  }

  /* 顶部平板状态栏 */
  .tablet-status-bar {
    height: 34px;
    background-color: var(--bg-paper-warm);
    border-bottom: 1px solid var(--border-hairline);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--text-secondary);
    flex-shrink: 0;
  }
  .status-date {
    color: var(--text-muted);
    font-size: 11.5px;
    letter-spacing: .01em;
  }
  .status-clock {
    color: var(--text-main);
    font: 600 13px var(--font-mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: .03em;
  }

  /* 页面滚动容器 */
  .page-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 22px 26px 36px 26px;
  }

  /* 响应式：竖屏 (< 860px) 或强制竖屏 */
  @media (max-width: 860px) {
    .side-nav {
      display: none !important;
    }
    .bottom-nav {
      display: flex !important;
    }
    .page-scroll {
      padding: 16px 16px 28px 16px;
    }
    .grid-2col, .kb-layout, .dict-layout, .settings-grid {
      grid-template-columns: 1fr !important;
    }
    .books-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }
  /* 网格与排版辅助 */
  .grid-2col {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 18px;
  }
  .books-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  /* 书库清单与书本详情 */
  .library-clean-page, .book-detail-page { --text-muted: #5F6A65; }
  .library-clean-page { width: 100%; max-width: 1120px; margin: 0 auto; }
  .library-clean-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .library-clean-head h1 { font-size: 30px; margin: 0 0 6px; }
  .library-motto { margin: 0; color: var(--text-secondary); font: 15.5px/1.65 var(--font-serif); letter-spacing: .01em; }
  .library-clean-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .library-count { color: var(--text-muted); font-size: 12px; }
  .library-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .real-book-cover { display: block; flex: 0 0 auto; object-fit: contain; border-radius: 5px; background: #fff; box-shadow: 0 3px 10px rgba(39, 48, 43, 0.14); }
  .book-cover-placeholder { display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 1px dashed var(--border-strong); border-radius: 5px; background: var(--bg-paper); color: var(--text-muted); font-size: 10px; letter-spacing: .08em; }
  .book-cover-placeholder small { font-size: 8.5px; letter-spacing: 0; }
  .library-book-card { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 16px; width: 100%; padding: 15px; border: 1px solid var(--border-hairline); border-radius: 14px; background: var(--bg-paper-elevated); color: var(--text-main); text-align: left; cursor: pointer; transition: border-color .16s ease, background-color .16s ease, transform .16s ease; }
  .library-book-card:hover { border-color: var(--primary-border); background: #FCFBF8; transform: translateY(-1px); }
  .library-book-card:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .library-book-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .library-book-info strong { font-size: 17px; line-height: 1.35; }
  .library-book-info > span { color: var(--text-muted); font-size: 11.5px; }
  .library-book-progress { display: block; height: 5px; margin-top: 4px; border-radius: 99px; background: var(--bg-paper-subtle); overflow: hidden; }
  .library-book-progress i { display: block; height: 100%; background: var(--primary); }
  .library-book-foot { display: flex; justify-content: space-between; gap: 10px; }
  .library-book-foot > span:last-child { color: var(--primary); }
  .library-empty { padding: 44px 0; border-top: 1px solid var(--border-hairline); color: var(--text-muted); font-size: 13px; }
  body.book-detail-focus .side-nav,
  body.book-detail-focus .bottom-nav { display: none !important; }
  body.book-detail-focus .main-stage { width: 100%; }
  .book-detail-page { width: 100%; max-width: 900px; margin: 0 auto; }
  .book-detail-back { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 2px; margin-bottom: 18px; border: 0; background: transparent; color: var(--text-secondary); font: 500 13px var(--font-sans); cursor: pointer; }
  .book-detail-back:hover { color: var(--primary); }
  .book-detail-sheet { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 36px; align-items: center; padding: 36px; border: 1px solid var(--border-hairline); border-radius: 18px; background: var(--bg-paper-elevated); }
  .book-detail-cover { display: flex; justify-content: center; }
  .book-detail-copy { min-width: 0; }
  .book-detail-copy h1 { margin: 6px 0 8px; font-size: 31px; line-height: 1.25; }
  .book-detail-author { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .book-detail-progress { margin-top: 30px; }
  .book-detail-progress-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .book-detail-progress-head span { color: var(--text-secondary); font-size: 12.5px; }
  .book-detail-counts { color: var(--text-main); font-size: 13px; font-weight: 600; }
  .book-detail-track { height: 8px; margin: 10px 0 9px; border-radius: 99px; overflow: hidden; background: var(--bg-paper-subtle); }
  .book-detail-track i { display: block; height: 100%; background: var(--primary); }
  .book-detail-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--text-muted); font-size: 11.5px; }
  .book-detail-actions { margin-top: 30px; }
  .book-detail-actions .btn { min-width: 180px; min-height: 50px; }
  @media (max-width: 760px) {
    .library-shelf { grid-template-columns: 1fr; }
    .library-clean-head { align-items: flex-start; flex-direction: column; }
    .book-detail-sheet { grid-template-columns: 1fr; gap: 24px; padding: 24px; text-align: center; }
    .book-detail-progress-head, .book-detail-foot { text-align: left; }
    .book-detail-actions .btn { width: 100%; }
  }

  /* 阅读器专属主题样式 */
  .reader-theme-white {
    --reader-bg: #FAF8F3;
    --reader-page: #FDFCF8;
    --reader-text: #1F2522;
    --reader-sub: #545D58;
    --reader-border: #DFDBD0;
  }
  .reader-theme-beige {
    --reader-bg: #EFE9DA;
    --reader-page: #F6F1E3;
    --reader-text: #2B261F;
    --reader-sub: #635B4E;
    --reader-border: #DCD2BE;
  }
  .reader-theme-green {
    --reader-bg: #E2ECE4;
    --reader-page: #EAF3EC;
    --reader-text: #1A2B22;
    --reader-sub: #475E51;
    --reader-border: #C4D6C9;
  }
  .reader-theme-night {
    --reader-bg: #181D1B;
    --reader-page: #202724;
    --reader-text: #D8DDD9;
    --reader-sub: #8F9B94;
    --reader-border: #313B36;
  }

  /* 抽屉与遮罩 */
  .drawer-backdrop {
    position: absolute;
    inset: 0;
    background-color: var(--bg-overlay);
    z-index: 40;
    display: flex;
    justify-content: flex-end;
    animation: fadeIn 0.16s ease;
  }
  .drawer-backdrop.left {
    justify-content: flex-start;
  }
  .drawer-panel {
    width: 420px;
    max-width: 92vw;
    height: 100%;
    background-color: var(--bg-paper-elevated);
    border-left: 1px solid var(--border-strong);
    box-shadow: var(--shadow-drawer);
    display: flex;
    flex-direction: column;
    z-index: 45;
  }
  .drawer-panel.left {
    width: 320px;
    border-left: none;
    border-right: 1px solid var(--border-strong);
  }

  /* 模态弹窗 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background-color: rgba(24, 30, 27, 0.38);
    z-index: 80;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-card {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    background-color: var(--bg-paper-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-float);
    padding: 22px;
  }

  /* 轻提示 Toast */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast-msg {
    background-color: #1F2E28;
    color: #F6F4EE;
    padding: 10px 18px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    border: 1px solid #3B564C;
    box-shadow: var(--shadow-float);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* 自定义滑块 */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    background: var(--border-strong);
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--primary);
    border: 2px solid #FAF8F3;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  /* 无限画板网格背景 */
  .freeform-grid {
    background-color: #F3EFE6;

function showToast(message) {
  const root = document.getElementById('toastRoot');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.innerHTML = `${ICONS.check}<span>${message}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.25s ease';
    setTimeout(() => el.remove(), 260);
  }, 2400);
}

let bookBoardCounts = new Map();
let bookBoardCountsPromise = null;

function boardCountFor(bookId) {
  return bookBoardCounts.get(bookId) || 0;
}

function loadBookBoardCounts() {
  if (bookBoardCountsPromise) return bookBoardCountsPromise;
  const getAllBoards = window.BianDuFeatures?.db?.getAll;
  if (!getAllBoards) return Promise.resolve();
  bookBoardCountsPromise = getAllBoards("boards").then(boards => {
    const next = new Map();
    for (const board of boards) {
      if (!board.bookId) continue;
      next.set(board.bookId, (next.get(board.bookId) || 0) + 1);
    }
    const changed = next.size !== bookBoardCounts.size ||
      [...next].some(([id, count]) => bookBoardCounts.get(id) !== count);
    bookBoardCounts = next;
    if (changed && (STATE.currentView === 'library' || STATE.currentView === 'book')) renderApp();
    return next;
  }).catch(() => new Map()).finally(() => { bookBoardCountsPromise = null; });
  return bookBoardCountsPromise;
}

window.addEventListener('biandu:local-data-changed', () => loadBookBoardCounts());

function switchView(viewId, options = {}) {
  if (STATE.currentView === 'reader' && viewId !== 'reader') {
    window.BianDuRuntime?.reader?.cancelTranslation?.('leave');
  }
  STATE.currentView = viewId;
  if (options.kbSubView) STATE.kbSubView = options.kbSubView;
  if (options.bookId) STATE.activeBookId = options.bookId;
  if (typeof options.excerptAiOpen === 'boolean') STATE.readerExcerptAiOpen = options.excerptAiOpen;
  if (options.selectedNodeId) STATE.selectedNodeId = options.selectedNodeId;
  if (options.selectedWordKey) STATE.selectedWordKey = options.selectedWordKey;
  if (options.boardId) STATE.activeBoardId = options.boardId;
  document.body.classList.toggle('reader-immersive', viewId === 'reader');
  document.body.classList.remove('board-immersive');
  document.body.classList.toggle('book-detail-focus', viewId === 'book');
  window.BianDuFeatures?.setReaderFocusMode?.(viewId === 'reader');
  renderApp();
}

function renderNavBars() {
  const sideNav = document.getElementById('sideNavList');
  const bottomNav = document.getElementById('bottomNavList');
  if (!sideNav || !bottomNav) return;

  sideNav.innerHTML = NAV_ITEMS.map(item => {
    const active = STATE.currentView === item.id ||
      (item.id === 'library' && ['reader', 'book'].includes(STATE.currentView));
    const displayBadge = item.id === 'library' ? String(BOOKS.length) : item.badge;
    return `
      <button class="nav-item ${active ? 'active' : ''}" data-nav="${item.id}">
        <span class="nav-item-left">
          ${ICONS[item.icon]}
          <span>${item.label}</span>
        </span>
        ${displayBadge ? `<span class="nav-badge">${displayBadge}</span>` : ''}
      </button>
    `;
  }).join('');

  bottomNav.innerHTML = NAV_ITEMS.map(item => {
    const active = STATE.currentView === item.id ||
      (item.id === 'library' && ['reader', 'book'].includes(STATE.currentView));
    return `
      <button class="bottom-nav-item ${active ? 'active' : ''}" data-nav="${item.id}">
        ${ICONS[item.icon]}
        <span>${item.label}</span>
      </button>
    `;
  }).join('');

  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.getAttribute('data-nav');
      if (target === 'kb' && STATE.currentView !== 'kb') {
        STATE.kbSubView = 'ask';
      }
      switchView(target);
    });
  });

}

function getNodeStyleByType(type) {
  const map = {
    '概念': { fill: '#1F4037', stroke: '#142B24', text: '#F7F5F0', badge: 'badge-green' },
    '书籍': { fill: '#C2654A', stroke: '#8F432D', text: '#FDFBF7', badge: 'badge-terracotta' },
    '人物': { fill: '#B68B3A', stroke: '#84601E', text: '#FDFBF7', badge: 'badge-gold' },
    '笔记': { fill: '#4E768B', stroke: '#355464', text: '#FDFBF7', badge: 'badge-blue' },
    '画板': { fill: '#6E5A4F', stroke: '#4A3B32', text: '#FDFBF7', badge: 'badge-neutral' },
    '生词': { fill: '#526B5C', stroke: '#36493E', text: '#F7F5F0', badge: 'badge-green' }
  };
  return map[type] || map['概念'];
}

            <div style="display:flex; align-items:center; gap:4px; padding-right:10px; border-right:1px solid var(--border-hairline);">

          <div>

/* ==========================================================================
   9. 页面八：英语生词词典页面 (My Dictionary)
   ========================================================================== */
function renderDictionaryPage() {
  const filters = ['全部', '待复习', '已掌握', '标注次数最多', '最近添加'];
  const q = STATE.dictSearch.trim().toLowerCase();

  let list = [...VOCAB_LIST];
  if (q) {
    list = list.filter(w => w.word.toLowerCase().includes(q) || w.meaning.includes(q) || w.books.toLowerCase().includes(q));
  }
  if (STATE.dictFilter === '待复习') {
    list = list.filter(w => w.status === '待复习');
  } else if (STATE.dictFilter === '已掌握') {
    list = list.filter(w => w.status === '已掌握');
  } else if (STATE.dictFilter === '标注次数最多') {
    list.sort((a, b) => b.count - a.count);
  }

  const selected = VOCAB_LIST.find(w => w.word === STATE.selectedWordKey) || VOCAB_LIST[0];

  return `
    <div class="page-scroll" style="display:flex; flex-direction:column; gap:18px;">
      <!-- 1. 顶部栏 -->
      <section class="card" style="padding:18px 22px;">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:14px;">
          <div>
            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
              <h1 class="serif-title" style="font-size:24px;">我的词典</h1>
              <span class="badge badge-green">已收录 86 个单词</span>
              <span class="badge badge-terracotta">今日待复习 8 个</span>
            </div>
            <p style="font-size:12.5px; color:var(--text-secondary); margin-top:4px;">
              阅读时长按英文单词自动归档 · <strong>同一个单词跨书多次标注不会重复建档，自动累计次数并保留不同原书语境</strong>
            </p>
          </div>

          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <div class="input-box" style="width:240px;">
              ${ICONS.search}
              <input type="text" id="dictSearchInput" value="${STATE.dictSearch}" placeholder="搜索单词、中文释义或来源书籍…" />
            </div>
            <button class="btn btn-primary" id="openReciteModalBtn">
              ${ICONS.sparkle}
              <span>开始背诵</span>
            </button>
          </div>
        </div>

        <!-- 5. 筛选器 -->
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; padding-top:12px; border-top:1px solid var(--border-hairline);">
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
            ${filters.map(f => `
              <button class="btn btn-sm dict-filter-btn ${STATE.dictFilter === f ? 'btn-primary' : ''}" data-dfilter="${f}" style="min-height:34px; padding:0 12px;">
                ${f}
              </button>

function renderApp() {
  window.BianDuFeatures?.captureReaderAnchor?.();
  renderNavBars();

  // 更新图标插槽
  document.querySelectorAll('.icon-slot').forEach(slot => {
    const name = slot.getAttribute('data-icon');

  });

  const main = document.getElementById('mainContent');
  if (!main) return;

  if (STATE.currentView === 'library') {
    main.innerHTML = renderLibraryPage();
    bindLibraryEvents();
  } else if (STATE.currentView === 'book') {
    main.innerHTML = renderBookDetailPage();
    bindBookDetailEvents();
  } else if (STATE.currentView === 'reader') {
    main.innerHTML = renderReaderPage();
    bindReaderEvents();

    main.innerHTML = renderKnowledgeBasePage();
    bindKnowledgeBaseEvents();
  } else if (STATE.currentView === 'graph') {

  } else if (STATE.currentView === 'board') {

    bindBoardEvents();

function bindKnowledgeGraphEvents() {
  const searchInp = document.getElementById('graphSearchInput');
  if (searchInp) {
    searchInp.addEventListener('input', e => {
      STATE.graphSearch = e.target.value;
      renderApp();
      const ref = document.getElementById('graphSearchInput');
      if (ref) {
        ref.focus();
        ref.setSelectionRange(ref.value.length, ref.value.length);
      }
    });
  }

  document.querySelectorAll('.graph-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.graphFilter = btn.getAttribute('data-gfilter');
      renderApp();
    });
  });

  const resetBtn = document.getElementById('graphResetViewBtn');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      STATE.graphZoom = 1;
      STATE.graphPanX = 0;
      STATE.graphPanY = 0;
      STATE.graphFilter = '全部节点';
      STATE.graphSearch = '';
      renderApp();
    });
  }

  const zIn = document.getElementById('graphZoomInBtn');
  const zOut = document.getElementById('graphZoomOutBtn');
  if (zIn) zIn.addEventListener('click', () => { STATE.graphZoom = Math.min(1.6, +(STATE.graphZoom + 0.12).toFixed(2)); renderApp(); });
  if (zOut) zOut.addEventListener('click', () => { STATE.graphZoom = Math.max(0.65, +(STATE.graphZoom - 0.12).toFixed(2)); renderApp(); });

  // 节点点击与拖拽
  const svg = document.getElementById('graphSvg');
  let draggingNode = null;
  let isPanning = false;
  let startX = 0, startY = 0;
  let moved = false;

  document.querySelectorAll('.graph-node-group').forEach(g => {
    const nodeId = g.getAttribute('data-node-id');
    g.addEventListener('pointerdown', e => {
      e.stopPropagation();
      draggingNode = GRAPH_NODES.find(n => n.id === nodeId);
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
    });
  });

  const wrap = document.getElementById('graphCanvasWrap');
  if (wrap && svg) {
    wrap.addEventListener('pointerdown', e => {
      if (!draggingNode) {
        isPanning = true;
        startX = e.clientX - STATE.graphPanX;
        startY = e.clientY - STATE.graphPanY;
      }
    });

    window.addEventListener('pointermove', e => {
      if (draggingNode) {
        const dx = (e.clientX - startX) / STATE.graphZoom;
        const dy = (e.clientY - startY) / STATE.graphZoom;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
        draggingNode.x = Math.max(55, Math.min(785, Math.round(draggingNode.x + dx)));
        draggingNode.y = Math.max(45, Math.min(455, Math.round(draggingNode.y + dy)));
        startX = e.clientX;
        startY = e.clientY;
        renderApp();
      } else if (isPanning) {
        STATE.graphPanX = Math.round(e.clientX - startX);
        STATE.graphPanY = Math.round(e.clientY - startY);
        const vp = document.getElementById('graphViewport');
        if (vp) vp.setAttribute('transform', `translate(${STATE.graphPanX}, ${STATE.graphPanY}) scale(${STATE.graphZoom})`);
      }
    }, { once: false });

    window.addEventListener('pointerup', () => {
      if (draggingNode && !moved) {
        STATE.selectedNodeId = draggingNode.id;
        draggingNode = null;
        renderApp();
      }
      draggingNode = null;
      isPanning = false;
    });

    wrap.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 0.08 : -0.08;
      STATE.graphZoom = Math.max(0.65, Math.min(1.6, +(STATE.graphZoom + delta).toFixed(2)));
      renderApp();
    }, { passive: false });
  }

  // 右侧详情面板跳转
  document.querySelectorAll('.graph-source-book-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.getAttribute('data-bname') || '';
      const found = BOOKS.find(b => b.title.includes(name) || name.includes(b.title)) || BOOKS[0];
      switchView('reader', { bookId: found.id, excerptAiOpen: false });
    });
  });

  const evJump = document.getElementById('graphJumpEvidenceReaderBtn');
  if (evJump) evJump.addEventListener('click', () => switchView('reader', { bookId: 'attention-economy' }));

  const boardJump = document.getElementById('graphJumpBoardBtn');
  if (boardJump) boardJump.addEventListener('click', () => switchView('board', { boardId: 'board-1' }));

  const openFullCard = document.getElementById('openFullKnowledgeCardBtn');
  if (openFullCard) {
    openFullCard.addEventListener('click', () => switchView('kb', { kbSubView: 'card' }));
  }
}

function bindBoardEvents() {
  const backReader = document.getElementById('boardBackReaderBtn');
  if (backReader) backReader.addEventListener('click', () => switchView('reader'));

  const sideJumpReader = document.getElementById('boardSideJumpReaderBtn');
  if (sideJumpReader) sideJumpReader.addEventListener('click', () => switchView('reader'));

  document.querySelectorAll('.switch-board-thumb-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.activeBoardId = btn.getAttribute('data-board-id');
      renderApp();
      showToast(`已切换至当前段落画板`);
    });
  });

  document.querySelectorAll('.board-tool-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tool = btn.getAttribute('data-tool');
      STATE.boardTool = tool;
      if (tool === 'image') {
        STATE.boardInsertedImages.push({
          id: 'case-' + Date.now(),
          x: 280 + (STATE.boardInsertedImages.length * 24) % 120,
          y: 70 + (STATE.boardInsertedImages.length * 20) % 90,
          title: '新插入案例图片：深度阅读与多任务切换脑电对比',
          subtitle: '本地图片已嵌入当前无限画板并自动同步知识库'
        });
        STATE.boardTool = 'select';
        renderApp();
        showToast('已在画板中插入新案例图片卡片');
        return;
      }
      if (tool === 'sticky') {
        STATE.boardStickyNotes.push({
          id: 'st-' + Date.now(),
          x: 270,
          y: 300,
          text: '手写便签：7天后清理原文，保留思维导图',
          color: '#F5ECD7'
        });
        STATE.boardTool = 'pen';
        renderApp();
        showToast('已在画板中添加新便签');
        return;
      }
      if (tool === 'eraser') {
        if (STATE.boardCustomStrokes.length > 0) {
          STATE.boardUndoStack.push(STATE.boardCustomStrokes.pop());
          showToast('已擦除最近一条手绘笔画');
        } else {
          showToast('当前可擦除自定义手绘笔画为空，试试用「手写笔」在画布上书写');
        }
        STATE.boardTool = 'pen';
        renderApp();
        return;
      }
      renderApp();
    });
  });

  document.querySelectorAll('.board-color-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.boardColor = btn.getAttribute('data-color');
      STATE.boardTool = 'pen';
      renderApp();
    });
  });

  document.querySelectorAll('.board-width-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.boardStrokeWidth = parseInt(btn.getAttribute('data-width'), 10);
      STATE.boardTool = 'pen';
      renderApp();
    });
  });

  const undoBtn = document.getElementById('boardUndoBtn');
  const redoBtn = document.getElementById('boardRedoBtn');
  if (undoBtn) {
    undoBtn.addEventListener('click', () => {
      if (STATE.boardCustomStrokes.length > 0) {
        STATE.boardUndoStack.push(STATE.boardCustomStrokes.pop());
        renderApp();
      } else {
        showToast('已回到初始画板状态');
      }
    });
  }
  if (redoBtn) {
    redoBtn.addEventListener('click', () => {
      if (STATE.boardUndoStack.length > 0) {
        STATE.boardCustomStrokes.push(STATE.boardUndoStack.pop());
        renderApp();
      }
    });
  }

  const zOut = document.getElementById('boardZoomOutBtn');
  const zIn = document.getElementById('boardZoomInBtn');
  const fitBtn = document.getElementById('boardFitCanvasBtn');
  if (zOut) zOut.addEventListener('click', () => { STATE.boardZoom = Math.max(50, STATE.boardZoom - 8); renderApp(); });
  if (zIn) zIn.addEventListener('click', () => { STATE.boardZoom = Math.min(140, STATE.boardZoom + 8); renderApp(); });
  if (fitBtn) {
    fitBtn.addEventListener('click', () => {
      STATE.boardZoom = 78;
      STATE.boardPanX = 0;
      STATE.boardPanY = 0;
      renderApp();
      showToast('已适应画布最佳比例 (78%)');
    });
  }

  const openLinkNodeBtn = document.getElementById('openLinkNodeModalBtn');
  if (openLinkNodeBtn) openLinkNodeBtn.addEventListener('click', openLinkNodeSelectorModal);

  document.querySelectorAll('[data-jump-card]').forEach(badge => {
    badge.addEventListener('click', () => switchView('kb', { kbSubView: 'card' }));
  });

  const selectedStrokeGroup = document.getElementById('selectedStrokeGroup');
  if (selectedStrokeGroup) {
    selectedStrokeGroup.addEventListener('click', e => {
      e.stopPropagation();
      STATE.boardSelectedStroke = !STATE.boardSelectedStroke;
      renderApp();
    });
  }

  // 真实手写笔绘制 & 画布拖动平移缩放
  const stage = document.getElementById('freeformStage');
  const svgCanvas = document.getElementById('boardSvgCanvas');
  const customGroup = document.getElementById('userCustomPathsGroup');
  if (stage && svgCanvas && customGroup) {
    let drawing = false;
    let panning = false;
    let currentPoints = [];
    let activePathEl = null;
    let panStartX = 0, panStartY = 0;

    const toSvgCoords = (clientX, clientY) => {
      const pt = svgCanvas.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      const ctm = svgCanvas.getScreenCTM();
      if (!ctm) return { x: 0, y: 0 };
      return pt.matrixTransform(ctm.inverse());
    };

    stage.addEventListener('pointerdown', e => {
      if (e.target.closest('button') || e.target.closest('aside')) return;
      if (STATE.boardTool === 'pen' && e.pointerType !== 'touch') {
        drawing = true;
        e.preventDefault();
        try { stage.setPointerCapture(e.pointerId); } catch {}
        const p = toSvgCoords(e.clientX, e.clientY);
        currentPoints = [p];
        activePathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        activePathEl.setAttribute('fill', 'none');
        activePathEl.setAttribute('stroke', STATE.boardColor);
        activePathEl.setAttribute('stroke-width', String(STATE.boardStrokeWidth));
        activePathEl.setAttribute('stroke-linecap', 'round');
        activePathEl.setAttribute('stroke-linejoin', 'round');
        activePathEl.setAttribute('d', `M ${p.x.toFixed(1)} ${p.y.toFixed(1)}`);
        customGroup.appendChild(activePathEl);
      } else {
        e.preventDefault();
        panning = true;
        panStartX = e.clientX - STATE.boardPanX;
        panStartY = e.clientY - STATE.boardPanY;
      }
    });

    stage.addEventListener('pointermove', e => {
      if (drawing && activePathEl) {
        e.preventDefault();
        const p = toSvgCoords(e.clientX, e.clientY);
        currentPoints.push(p);
        const d = currentPoints.map((pt, idx) => `${idx === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ');
        activePathEl.setAttribute('d', d);
      } else if (panning) {
        e.preventDefault();
        STATE.boardPanX = Math.round(e.clientX - panStartX);
        STATE.boardPanY = Math.round(e.clientY - panStartY);
        const world = document.getElementById('boardWorld');
        const scaleVal = (STATE.boardZoom / 78).toFixed(3);
        if (world) world.style.transform = `translate(${STATE.boardPanX}px, ${STATE.boardPanY}px) scale(${scaleVal})`;
        stage.style.backgroundPosition = `${STATE.boardPanX}px ${STATE.boardPanY}px`;
      }
    });

    const finishPointer = () => {
      if (drawing && currentPoints.length > 1) {
        const d = currentPoints.map((pt, idx) => `${idx === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ');
        STATE.boardCustomStrokes.push({
          d,
          color: STATE.boardColor,
          width: STATE.boardStrokeWidth
        });
        const badge = document.getElementById('boardSaveStatusBadge');
        if (badge) badge.textContent = '● 已自动保存笔迹';
      }
      drawing = false;
      panning = false;
      activePathEl = null;
    };

    stage.addEventListener('pointerup', finishPointer);
    stage.addEventListener('pointerleave', finishPointer);
    stage.addEventListener('pointercancel', finishPointer);
    stage.addEventListener('lostpointercapture', finishPointer);

    stage.addEventListener('wheel', e => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? 4 : -4;
      STATE.boardZoom = Math.max(50, Math.min(140, STATE.boardZoom + delta));
      renderApp();
    }, { passive: false });
  }
}

function bindDictionaryEvents() {
  const searchInp = document.getElementById('dictSearchInput');
  if (searchInp) {
    searchInp.addEventListener('input', e => {
      STATE.dictSearch = e.target.value;
      renderApp();
      const ref = document.getElementById('dictSearchInput');
      if (ref) {
        ref.focus();
        ref.setSelectionRange(ref.value.length, ref.value.length);
      }
    });
  }

  document.querySelectorAll('.dict-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      STATE.dictFilter = btn.getAttribute('data-dfilter');
      renderApp();
    });
  });

  document.querySelectorAll('.dict-word-card').forEach(card => {
    card.addEventListener('click', () => {
      STATE.selectedWordKey = card.getAttribute('data-word');
      renderApp();
    });
  });

  const openReciteBtn = document.getElementById('openReciteModalBtn');
  if (openReciteBtn) openReciteBtn.addEventListener('click', () => openReciteModal('recall'));

  const speakBtn = document.getElementById('dictSpeakWordBtn');
  if (speakBtn) speakBtn.addEventListener('click', () => showToast(`正在朗读单词 ${STATE.selectedWordKey}`));

  const toggleMastery = document.getElementById('toggleMasteryStatusBtn');
  if (toggleMastery) {
    toggleMastery.addEventListener('click', () => {
      const item = VOCAB_LIST.find(w => w.word === STATE.selectedWordKey);
      if (item) {
        item.status = item.status === '已掌握' ? '待复习' : '已掌握';
        renderApp();
        showToast(`已将 ${item.word} 标记为「${item.status}」`);
      }
    });
  }

  const togglePlan = document.getElementById('toggleReviewPlanBtn');
  if (togglePlan) {
    togglePlan.addEventListener('click', () => {
      const item = VOCAB_LIST.find(w => w.word === STATE.selectedWordKey);
      if (item) {
        item.inPlan = !item.inPlan;
        renderApp();
        showToast(item.inPlan ? `已将 ${item.word} 加入今日复习计划` : `已从复习计划中移除 ${item.word}`);
      }
    });
  }

  document.querySelectorAll('.select-context-sentence-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-ctx-idx'), 10);
      const item = VOCAB_LIST.find(w => w.word === STATE.selectedWordKey);
      if (item && item.contexts[idx]) {
        item.contexts.forEach((c, i) => { c.activeContext = (i === idx); });
        renderApp();
        showToast('已将该原书句子设为背诵主语境例句');
      }
    });
  });

  document.querySelectorAll('.dict-jump-reader-btn').forEach(btn => {
    btn.addEventListener('click', () => switchView('reader', { bookId: 'attention-economy' }));
  });

  document.querySelectorAll('.launch-review-mode-card').forEach(card => {
    card.addEventListener('click', () => {
      const mode = card.getAttribute('data-mode') || 'recall';
      openReciteModal(mode);
    });
  });
}
